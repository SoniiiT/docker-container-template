version: "3"
services:
  whatsupdocker:
    image: fmartinou/whats-up-docker
    container_name: whats-up-docker
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 4000:3000
    environment:
      - WUD_WATCHER_LOCAL_SOCKET=/var/run/docker.sock
      - WUD_WATCHER_DOCKER-SRV-02_HOST=0.0.0.0
      # - WUD_WATCHER_DOCKER-SRV-03_HOST=0.0.0.0
      - WUD_TRIGGER_DISCORD_1_URL=https://discord.com/api/webhooks/123/123
      - WUD_TRIGGER_DISCORD_1_BOTUSERNAME=Whats up Docker
      - WUD_TRIGGER_DOCKER_UPDATE_DRYRUN=true
networks: {}