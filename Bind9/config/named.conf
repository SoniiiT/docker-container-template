include "/etc/bind/named.conf.key";

acl internal {
    192.168.178.0/24;
};

options {
    forwarders {
        1.1.1.1;
        8.8.8.8;
    };
    allow-query { 
        internal;
    };
};

zone "network.example.com" IN {
    type master;
    file "/etc/bind/network.zone";
    update-policy { 
        grant tsig-key zonesub any; 
    };
};