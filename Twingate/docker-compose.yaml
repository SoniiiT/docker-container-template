services:
  # Beispiel-Connector — Block kopieren und NAME/TOKEN für jeden weiteren Connector anpassen
  twingate-connector-example:
    container_name: twingate-connector-example
    image: twingate/connector:1.88.0
    restart: unless-stopped
    pull_policy: always
    environment:
      - TWINGATE_NETWORK=${TWINGATE_NETWORK}
      - TWINGATE_ACCESS_TOKEN=${TWINGATE_ACCESS_TOKEN_EXAMPLE}
      - TWINGATE_REFRESH_TOKEN=${TWINGATE_REFRESH_TOKEN_EXAMPLE}
      - TWINGATE_LABEL_HOSTNAME=${HOSTNAME}
      - TWINGATE_LABEL_DEPLOYED_BY=docker
      # -- (Optional) Change loglevel
      - TWINGATE_LOG_LEVEL=3